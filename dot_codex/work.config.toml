# Explicit alias for the default local work loop; base permissions and hooks remain active.
model = "gpt-6-astra"
model_reasoning_effort = "medium"
developer_instructions = """
Use the work-loop skill at ~/.codex/skills/work-loop/SKILL.md for substantive code work.
Act as the orchestrator: own scope, delegate bounded implementation, resolve advisor requests,
and accept changes using observed checks and fresh review. Handle trivial edits directly.
"""

[agents]
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
max_concurrent_threads_per_session = 3
