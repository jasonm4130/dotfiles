# Codex CLI defaults.
#
# Automatic cross-provider review passes run on Terra; Sol is reserved for when
# Jason names him (see ~/Work/Git/CLAUDE.md). The CLI's own default is
# gpt-5.6-sol, which inverts that rule silently -- every unflagged `codex exec`
# would bill Sol rates on a pass meant for Terra. Hence the pin.
#
# Escalate explicitly:  codex exec -m gpt-5.6-sol ...
model = "gpt-5.6-terra"
