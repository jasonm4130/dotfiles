# herdr — Ghostty runs Monokai Pro, so the base is the terminal palette and the
# UI tokens are Monokai Pro's own colours. Managed by chezmoi.

onboarding = false

[theme]
name = "terminal"
[theme.custom]
sidebar_bg = "#221f22"
active_row_bg = "#2d2a2e"
selection_bg = "#403e41"
accent = "#ffd866"
red = "#ff6188"
green = "#a9dc76"

[ui]
agent_panel_sort = "priority"
status_indicators = "symbols"          # Nerd Font glyphs per state instead of dots
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
prompt_new_tab_name = false
window_title = "{workspace} · {tab}"
tab_bar_right = [{ type = "datetime", format = "%a %H:%M" }, { type = "hostname" }]
tab_bar_right_separator = "  "

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.toast]
delivery = "system"                    # macOS notification when a background agent needs you
delay_seconds = 2

[ui.sound]
enabled = false                        # the tab-title hook already plays the fanfare

[session]
resume_agents_on_restore = true

# prefix+alt+j: the Nightwatch journal in a popup
[[keys.command]]
key = "prefix+alt+j"
type = "popup"
command = "tail -n 40 -f ~/.local/state/nightwatch/ambient/journal.md"
width = "90%"
height = "60%"
