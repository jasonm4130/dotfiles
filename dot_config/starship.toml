add_newline = true

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[directory]
truncation_length = 3
truncate_to_repo  = true
style             = "bold cyan"

[git_branch]
symbol = " "
style  = "bold purple"

[git_status]
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
modified  = "*${count}"
untracked = "?${count}"
stashed   = "$${count}"

[cmd_duration]
min_time = 2000
format   = "took [$duration](yellow)"

[nodejs]
format = "via [⬢ $version](bold green) "

[python]
format = "via [🐍 $version](yellow bold) "

[rust]
format = "via [⚙ $version](red bold) "
