name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run hook & script tests
        # Unquoted glob, not a bare directory: Node 22's test runner errors on
        # a directory arg (Node 20 scanned it), and Node 20 has no native glob
        # support (added in 21) — the shell must expand it.
        run: node --test tests/*.test.mjs
